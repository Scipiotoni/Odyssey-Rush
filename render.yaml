# Render Blueprint: game server + Postgres database that stores the shared persistent world.
services:
  - type: web
    name: odyssey-rush
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: odyssey-rush-db
          property: connectionString

databases:
  - name: odyssey-rush-db
    plan: free
    region: frankfurt
    databaseName: odyssey_rush_db
    user: odyssey_rush_db_user
    postgresMajorVersion: "16"
